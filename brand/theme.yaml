# Brand Theme - 실제 IR 템플릿 기반
colors:
  primary: "#1A1A1A"         # 본문 텍스트 (거의 검정)
  secondary: "#4A4A4A"       # 보조 텍스트
  accent: "#E8600A"          # 오렌지 악센트 (핵심 강조)
  background: "#FFFFFF"      # 배경
  card_bg: "#F2F2F2"         # 카드/패널 배경 (연한 회색)
  text_primary: "#1A1A1A"
  text_secondary: "#808080"
  positive: "#2ECC71"
  negative: "#E74C3C"
  header_bg: "#1A1A1A"       # 카드 내부 헤더 배경 (검정)

fonts:
  heading: "Arial"
  body: "Arial"
  mono: "Courier New"

sizes:
  section_label: 16          # 오렌지 섹션 라벨 크기
  title: 28                  # 큰 헤드라인 크기
  subtitle: 22
  body: 14
  caption: 11
  metric_highlight: 56
  slide_number: 12
