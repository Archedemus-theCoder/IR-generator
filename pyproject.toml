[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ir-generator"
version = "0.1.0"
description = "IR deck management system with automated PPT generation"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.0",
    "pydantic>=2.0",
    "matplotlib>=3.7",
]

[project.scripts]
ir = "ir_generator.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
